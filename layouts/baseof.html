<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; color: #1d1d1f; }
    nav a { margin-right: 1rem; }
    .tags a { display: inline-block; background: #eef; border-radius: 999px; padding: 0 .6rem; margin-right: .4rem; font-size: .85rem; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <a href="{{ "blog/" | relURL }}">Blog</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Year }} Harbor</p>
  </footer>
</body>
</html>
